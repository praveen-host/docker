name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Log in to Docker Hub (uses secrets you set in the repo)
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push the image
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./SimpleWebAPI
          file: ./SimpleWebAPI/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/simplewebapi:latest
            ${{ vars.DOCKERHUB_USERNAME }}/simplewebapi:${{ github.sha }}
